[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unun-vna"
version = "0.6.0"
description = "S-A-A-2/NanoVNA V2 helper for UnUn efficiency measurements"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pynanovna",
]

[project.scripts]
unun-vna = "unun_vna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
